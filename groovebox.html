<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groovebox">
<title>D-Box Groovebox</title>
<style>
:root{--bg:#15171a;--panel:#20242a;--ink:#e8eaed;--dim:#8b929c;--off:#2d333b;--acc:#ff7a1a;--acc2:#35d6a5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e6df;--panel:#f7f5f0;--ink:#1c1e21;--dim:#6b7078;--off:#d6d2c8}}
:root[data-theme="light"]{--bg:#e9e6df;--panel:#f7f5f0;--ink:#1c1e21;--dim:#6b7078;--off:#d6d2c8}
:root[data-theme="dark"]{--bg:#15171a;--panel:#20242a;--ink:#e8eaed;--dim:#8b929c;--off:#2d333b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border-radius:14px;padding:10px}
h1{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
h1 span{color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--off);border:0;border-radius:10px;padding:10px 12px}
button.on,.tab.sel{background:var(--acc);color:#fff}
#play{flex:1;font-weight:700;font-size:17px}
#play.on{background:var(--acc2);color:#04231a}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tab{padding:10px 0;font-size:12px;font-weight:600;position:relative}
.tab.mute{opacity:.4}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.step{aspect-ratio:1;border-radius:10px;background:var(--off);border:2px solid transparent;font-size:11px;padding:0;color:var(--dim)}
.step.beat{background:color-mix(in srgb,var(--off) 80%,var(--ink))}
.step.act{background:var(--acc);color:#fff}
.step.cur{border-color:var(--acc2)}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);flex:1;min-width:120px}
input[type=range]{width:100%;accent-color:var(--acc)}
.notes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.notes button{padding:8px 0;font-size:12px}
.hint{font-size:12px;color:var(--dim)}
#rec{font-weight:700}
#rec.recording{background:#e5322d;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
audio{width:100%}
</style></head><body>
<main>
 <div class="row"><h1>D-<span>Box</span> Groovebox</h1></div>
 <div class="panel row">
  <button id="play">▶ Play</button>
  <button id="rec">● Rec</button><button id="clr">Clear</button><button id="rnd">Random</button>
 </div>
 <div class="panel row">
  <label>Tempo <b id="bv">120</b> BPM<input id="bpm" type="range" min="60" max="200" value="120"></label>
  <label>Swing <b id="sv">0</b>%<input id="swg" type="range" min="0" max="60" value="0"></label>
 </div>
 <div class="panel"><div class="tabs" id="tabs"></div>
  <div class="row" style="margin-top:8px"><button id="mute">Mute track</button><span class="hint" id="thint"></span></div></div>
 <div class="panel"><div class="steps" id="steps"></div></div>
 <div class="panel"><div class="row" style="justify-content:space-between"><b id="eqt" style="font-size:12px;letter-spacing:.1em">EQ</b><button id="eqr" style="padding:6px 10px">Reset EQ</button></div>
  <div class="row" style="margin-top:6px"><label>Low <b id="elv">0</b> dB<input id="elo" type="range" min="-12" max="12" step="1" value="0"></label><label>Mid <b id="emv">0</b> dB<input id="emi" type="range" min="-12" max="12" step="1" value="0"></label><label>High <b id="ehv">0</b> dB<input id="ehi" type="range" min="-12" max="12" step="1" value="0"></label></div></div>
 <div class="panel" id="synthp" hidden>
  <div class="hint" style="margin-bottom:6px">Pick a note, then tap steps to place it</div>
  <div class="notes" id="notes"></div>
  <div class="row" style="margin-top:8px">
   <select id="wave"><option>sawtooth</option><option>square</option><option>triangle</option></select>
   <label>Cutoff<input id="cut" type="range" min="200" max="6000" value="1800"></label>
   <label>Octave<input id="oct" type="range" min="-1" max="2" step="1" value="0"></label>
  </div></div>
 <div class="panel" id="recpanel" hidden><div class="hint" style="margin-bottom:6px">Your recording</div><audio id="player" controls playsinline></audio><div class="row" style="margin-top:8px"><select id="fmt"><option value="wav">WAV</option><option value="mp3">MP3</option></select><button id="save">Save file</button><button id="disc">Discard</button><span class="hint" id="rnote"></span></div></div>
 <div class="hint">Tip: in Safari tap Share → Add to Home Screen to use it like an app. Sounds are generated live, no samples.</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const TR=[{n:'KICK'},{n:'SNARE'},{n:'HAT'},{n:'CLAP'},{n:'BASS',s:1,base:36},{n:'LEAD',s:1,base:60}];
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let pat=TR.map(()=>Array.from({length:16},()=>({on:0,n:0}))),mute=TR.map(()=>0),cur=0,note=0,playing=false,step=0,next=0,timer=null,ctx,nbuf;
const cfg={bpm:120,swing:0,wave:'sawtooth',cut:1800,oct:0};
let eq=TR.map(()=>({lo:0,mi:0,hi:0})),tb=[];
try{const s=JSON.parse(localStorage.getItem('dbox')||'null');if(s){pat=s.pat||pat;Object.assign(cfg,s.cfg||{});if(s.eq&&s.eq.length==TR.length)eq=s.eq}}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('dbox',JSON.stringify({pat,cfg,eq}))}catch(e){}}
function init(){if(ctx){if(ctx.state!=='running')ctx.resume();return}
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const c=ctx.createDynamicsCompressor();c.connect(ctx.destination);dest=ctx.createMediaStreamDestination();c.connect(dest);out=c;
 tb=TR.map((_,i)=>{const lo=ctx.createBiquadFilter(),mi=ctx.createBiquadFilter(),hi=ctx.createBiquadFilter();
  lo.type='lowshelf';lo.frequency.value=200;mi.type='peaking';mi.frequency.value=1000;mi.Q.value=1;hi.type='highshelf';hi.frequency.value=4000;
  lo.gain.value=eq[i].lo;mi.gain.value=eq[i].mi;hi.gain.value=eq[i].hi;lo.connect(mi);mi.connect(hi);hi.connect(c);return{inp:lo,lo,mi,hi}})}
let out,dest,bus;
function env(g,t,a,v,dur){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
function noise(t,dur,type,f,v){const s=ctx.createBufferSource();s.buffer=nbuf;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ctx.createGain();env(g,t,.001,v,dur);s.connect(fl).connect(g).connect(bus);s.start(t);s.stop(t+dur+.05)}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);env(g,t,.002,1,.45);o.connect(g).connect(bus);o.start(t);o.stop(t+.5)}
function snare(t){noise(t,.2,'highpass',1800,.6);const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=190;env(g,t,.001,.5,.12);o.connect(g).connect(bus);o.start(t);o.stop(t+.15)}
function hat(t){noise(t,.05,'highpass',7500,.35)}
function clap(t){[0,.012,.025].forEach(d=>noise(t+d,.05,'bandpass',1500,.5));noise(t+.035,.18,'bandpass',1400,.4)}
function syn(t,midi,len,isBass){const f=440*Math.pow(2,(midi-69)/12),o=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
 o.type=isBass?cfg.wave:'square';o.frequency.value=f;fl.type='lowpass';fl.Q.value=6;
 fl.frequency.setValueAtTime(cfg.cut*(isBass?1:1.6),t);fl.frequency.exponentialRampToValueAtTime(Math.max(120,cfg.cut*.2),t+len);
 env(g,t,.005,isBass?.5:.3,len);o.connect(fl).connect(g).connect(bus);o.start(t);o.stop(t+len+.05)}
function trig(i,st,t){if(mute[i])return;const s=pat[i][st];if(!s.on)return;bus=tb[i].inp;
 if(i==0)kick(t);else if(i==1)snare(t);else if(i==2)hat(t);else if(i==3)clap(t);
 else syn(t,TR[i].base+s.n+cfg.oct*12*(i==5?1:1),60/cfg.bpm/4*1.8,i==4)}
function tick(){while(next<ctx.currentTime+.12){let t=next+(step%2?(cfg.swing/100)*(60/cfg.bpm/4):0);
 TR.forEach((_,i)=>trig(i,step,t));
 const sc=step;setTimeout(()=>{cursor=sc;draw()},Math.max(0,(t-ctx.currentTime)*1000));
 next+=60/cfg.bpm/4;step=(step+1)%16}}
let cursor=-1;
function toggle(){init();playing=!playing;$('play').classList.toggle('on',playing);$('play').textContent=playing?'■ Stop':'▶ Play';
 if(playing){step=0;next=ctx.currentTime+.05;timer=setInterval(tick,25)}else{clearInterval(timer);cursor=-1;draw();if(rec)stopRec()}}
function draw(){
 [...$('tabs').children].forEach((b,i)=>{b.classList.toggle('sel',i==cur);b.classList.toggle('mute',!!mute[i])});
 $('mute').classList.toggle('on',!!mute[cur]);$('mute').textContent=mute[cur]?'Unmute track':'Mute track';
 const sy=!!TR[cur].s;$('synthp').hidden=!sy;
 [...$('steps').children].forEach((b,i)=>{const s=pat[cur][i];b.className='step'+(i%4==0?' beat':'')+(s.on?' act':'')+(i==cursor?' cur':'');b.textContent=sy&&s.on?NN[s.n%12]:(i+1)});
 [...$('notes').children].forEach((b,i)=>b.classList.toggle('on',i==note));
 $('thint').textContent=TR[cur].n+' pattern';setEq()}
TR.forEach((t,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=t.n;b.onclick=()=>{cur=i;draw()};$('tabs').appendChild(b)});
for(let i=0;i<16;i++){const b=document.createElement('button');b.onclick=()=>{init();const s=pat[cur][i];
 if(TR[cur].s){if(s.on&&s.n==note)s.on=0;else{s.on=1;s.n=note}}else s.on=s.on?0:1;
 if(s.on&&!playing){const t=ctx.currentTime+.01;const sv=pat[cur][i];trig(cur,i,t)}save();draw()};$('steps').appendChild(b)}
for(let i=0;i<12;i++){const b=document.createElement('button');b.textContent=NN[i];b.onclick=()=>{note=i;draw()};$('notes').appendChild(b)}
$('play').onclick=toggle;
$('mute').onclick=()=>{mute[cur]^=1;draw()};
$('clr').onclick=()=>{pat[cur].forEach(s=>s.on=0);save();draw()};
$('rnd').onclick=()=>{const d=[.3,.2,.6,.15,.45,.35][cur];pat[cur].forEach((s,i)=>{s.on=(cur==0?i%4==0:Math.random()<d)?1:0;s.n=[0,3,5,7,10,12%12][Math.floor(Math.random()*6)]});save();draw()};
function bind(id,key,out,fmt){const e=$(id);e.value=cfg[key];if(out)$(out).textContent=cfg[key];e.oninput=()=>{cfg[key]=e.type=='range'?+e.value:e.value;if(out)$(out).textContent=cfg[key];save()}}
bind('bpm','bpm','bv');bind('swg','swing','sv');bind('wave','wave');bind('cut','cut');bind('oct','oct');
let rec=false,takeL=[],takeR=[],takeSr=44100,L=[],R=[],proc=null,zg=null,recT0=0,recTimer=null,wavBuf=null,lastUrl=null,auto=false;
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function encWav(L,R,sr){const n=L.reduce((t,x)=>t+x.length,0),buf=new ArrayBuffer(44+n*4),v=new DataView(buf);
 const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*4,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);
 v.setUint32(24,sr,true);v.setUint32(28,sr*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*4,true);
 let o=44;for(let c=0;c<L.length;c++){const x=L[c],y=R[c];for(let i=0;i<x.length;i++){v.setInt16(o,Math.max(-1,Math.min(1,x[i]))*32767,true);v.setInt16(o+2,Math.max(-1,Math.min(1,y[i]))*32767,true);o+=4}}
 return buf}
let crcT=null;
function crc32(u){if(!crcT){crcT=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crcT[i]=c>>>0}}
 let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipOne(name,data){const nb=new TextEncoder().encode(name),crc=crc32(data),n=data.length,
 out=new Uint8Array(30+nb.length+n+46+nb.length+22),v=new DataView(out.buffer);let o=0;
 v.setUint32(o,0x04034b50,true);v.setUint16(o+4,20,true);v.setUint16(o+6,0,true);v.setUint16(o+8,0,true);v.setUint16(o+10,0,true);v.setUint16(o+12,33,true);
 v.setUint32(o+14,crc,true);v.setUint32(o+18,n,true);v.setUint32(o+22,n,true);v.setUint16(o+26,nb.length,true);v.setUint16(o+28,0,true);o+=30;
 out.set(nb,o);o+=nb.length;out.set(data,o);o+=n;const cd=o;
 v.setUint32(o,0x02014b50,true);v.setUint16(o+4,20,true);v.setUint16(o+6,20,true);v.setUint16(o+8,0,true);v.setUint16(o+10,0,true);v.setUint16(o+12,0,true);v.setUint16(o+14,33,true);
 v.setUint32(o+16,crc,true);v.setUint32(o+20,n,true);v.setUint32(o+24,n,true);v.setUint16(o+28,nb.length,true);v.setUint32(o+42,0,true);o+=46;
 out.set(nb,o);o+=nb.length;const cs=o-cd;
 v.setUint32(o,0x06054b50,true);v.setUint16(o+8,1,true);v.setUint16(o+10,1,true);v.setUint32(o+12,cs,true);v.setUint32(o+16,cd,true);
 return out}
function startRec(){init();L=[];R=[];proc=ctx.createScriptProcessor(4096,2,2);
 proc.onaudioprocess=e=>{if(!rec)return;L.push(new Float32Array(e.inputBuffer.getChannelData(0)));R.push(new Float32Array(e.inputBuffer.getChannelData(e.inputBuffer.numberOfChannels>1?1:0)))};
 out.connect(proc);zg=ctx.createGain();zg.gain.value=0;proc.connect(zg);zg.connect(ctx.destination);
 rec=true;recT0=Date.now();$('rec').classList.add('recording');$('rec').textContent='\u25a0 0:00';
 recTimer=setInterval(()=>{$('rec').textContent='\u25a0 '+fmt(Date.now()-recT0)},250);
 if(!playing){auto=true;toggle()}}
function stopRec(){if(!rec)return;rec=false;clearInterval(recTimer);$('rec').classList.remove('recording');$('rec').textContent='\u25cf Rec';
 try{out.disconnect(proc);proc.disconnect();zg.disconnect()}catch(e){}
 if(L.length){takeL=L;takeR=R;takeSr=ctx.sampleRate;wavBuf=encWav(L,R,ctx.sampleRate);if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(new Blob([wavBuf],{type:'audio/wav'}));
  $('player').src=lastUrl;$('rnote').textContent=fmt(Date.now()-recT0)+' \u00b7 WAV '+(wavBuf.byteLength/1048576).toFixed(1)+' MB';$('recpanel').hidden=false}
 L=[];R=[];if(auto&&playing){auto=false;toggle()}auto=false}
$('rec').onclick=()=>{rec?stopRec():startRec()};
$('disc').onclick=()=>{$('player').pause();$('recpanel').hidden=true;wavBuf=null};
function encMp3(){const enc=new lamejs.Mp3Encoder(2,takeSr,128),parts=[],B=1152;
 const toI=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++)o[i]=Math.max(-1,Math.min(1,a[i]))*32767;return o};
 for(let c=0;c<takeL.length;c++){const l=toI(takeL[c]),r=toI(takeR[c]);for(let i=0;i<l.length;i+=B){const x=enc.encodeBuffer(l.subarray(i,i+B),r.subarray(i,i+B));if(x.length)parts.push(new Uint8Array(x))}}
 const e=enc.flush();if(e.length)parts.push(new Uint8Array(e));
 const n=parts.reduce((t,x)=>t+x.length,0),u=new Uint8Array(n);let o=0;parts.forEach(x=>{u.set(x,o);o+=x.length});return u}
$('save').onclick=async()=>{if(!wavBuf)return;const name='dbox-take-'+Date.now(),mp3=$('fmt').value==='mp3';let bytes,ext,mime;
 if(mp3){if(!window.lamejs){$('rnote').textContent='MP3 encoder could not load; use WAV';return}
  try{bytes=encMp3()}catch(e){$('rnote').textContent='MP3 encoding failed; use WAV';return}ext='mp3';mime='audio/mpeg'}
 else{bytes=new Uint8Array(wavBuf);ext='wav';mime='audio/wav'}
 try{const f=new File([bytes],name+'.'+ext,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}}catch(e){}
 try{const d=window.claude&&await claude.use('downloads');if(!d){$('rnote').textContent='Saving is not available here';return}
  await d.save({filename:name+'.zip',data:zipOne(name+'.'+ext,bytes)});$('rnote').textContent='Saved as ZIP: open it in Files to get the .'+ext}
 catch(e){if(!e||e.code!=='declined')$('rnote').textContent='Could not save: '+((e&&e.message)||e)}};
const EQS=[['elo','lo','elv'],['emi','mi','emv'],['ehi','hi','ehv']];
function setEq(){EQS.forEach(([id,k,l])=>{$(id).value=eq[cur][k];$(l).textContent=(eq[cur][k]>0?'+':'')+eq[cur][k]});$('eqt').textContent='EQ \u2014 '+TR[cur].n}
EQS.forEach(([id,k,l])=>{$(id).oninput=()=>{const v=+$(id).value;eq[cur][k]=v;$(l).textContent=(v>0?'+':'')+v;if(tb[cur])tb[cur][k].gain.value=v;save()}});
$('eqr').onclick=()=>{eq[cur]={lo:0,mi:0,hi:0};['lo','mi','hi'].forEach(k=>{if(tb[cur])tb[cur][k].gain.value=0});save();setEq()};
draw();
</script></body></html>
